name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main  # 每次推送到 main 分支，自动触发更新

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            # 清空目标目录
            rm -rf /var/www/html/*
            
      - name: Upload dist folder via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Deploy backend service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            # 创建后端目录
            mkdir -p /var/www/html/backend
            
            # 复制后端文件
            cd /var/www/html/backend
            rm -rf *
            
      - name: Upload backend files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "backend/*"
          target: "/var/www/html/backend"

      - name: Install backend dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            cd /var/www/html/backend
            npm install --production

      - name: Setup backend service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            # 创建 systemd 服务文件
            cat > /etc/systemd/system/luckboxdiy-backend.service << 'EOF'
            [Unit]
            Description=Luckboxdiy Backend Service
            After=network.target

            [Service]
            ExecStart=/usr/bin/node /var/www/html/backend/server.js
            WorkingDirectory=/var/www/html/backend
            Restart=always
            RestartSec=10
            Environment=NODE_ENV=production

            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 重新加载 systemd
            sudo systemctl daemon-reload
            
            # 启用并启动服务
            sudo systemctl enable luckboxdiy-backend.service
            sudo systemctl restart luckboxdiy-backend.service
            
            # 检查服务状态
            sudo systemctl status luckboxdiy-backend.service

      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            sudo systemctl restart nginx
            echo "Nginx restarted successfully!"
